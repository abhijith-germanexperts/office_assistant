name: ge_assistant
description: A new Flutter project.
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Assets
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  auto_size_text: ^3.0.0
  dots_indicator: ^4.0.1
  lottie: ^3.3.2
  flutter_svg: ^2.0.17
  badges: ^3.1.2
#  flutter_inset_box_shadow: ^1.0.8
  flutter_inset_shadow: ^2.0.3
  # Utilities
  http: ^1.3.0
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.5.2
  package_info_plus: ^9.0.0
  provider: ^6.1.2
  intl: ^0.20.2
  window_manager: ^0.5.1
  one_context: ^4.1.0
  permission_handler: ^12.0.1

  # Media & Notifications (Critical Updates for Android 16KB)
  audioplayers: ^6.5.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - image/
    - assets/audiolib/